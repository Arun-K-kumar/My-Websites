    const brem = document.getElementById("brem");

  let val = 0.0 ;

//   val = h1.value;

        if(h1.textContent % 10 != 0){

    bAC.onclick=function(){
        h1.textContent=0;
        val=0;
    }

    bmul.onclick=function(){
        h1.textContent= "*";
        op = "*";
        num1 = val;
        val = 0;
        
    }

    bdiv.onclick=function(){
        h1.textContent= "/";
        op = "/";
        num1 = val;
        val = 0;
        
    }
    badd.onclick=function(){
        h1.textContent= "+";
        op = "+";
        num1 = val;
        val = 0;
        
    }
    bsub.onclick=function(){
        h1.textContent= "-";
        op = "-";
        num1 = val;
        val = 0;
        
    }
    brem.onclick=function(){
        h1.textContent= "%";
        op = "%";
        num1 = val;
        val = 0;
        
    }

    beq.onclick=function(){
        num2 = val;
        if(op == "*"){
            val = num1 * num2;
        }
        else if(op == "/"){
            val = num1 / num2;
        }
        else if(op == "+"){
            val = num1 + num2;
        }
        else if(op == "-"){
            val = num1 - num2;
        }
        else if(op == "%"){
            val = num1 % num2;
        }
        h1.textContent = val;
    }
